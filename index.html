<style>
  :root{
    --bg:#15130F; --surface:#201D17; --raised:#26221A; --line:#3A362C;
    --chalk:#EDE7D9; --muted:#9C9484; --ember:#E2571C; --emberDim:#7A3416;
    --moss:#8FA646; --dim:#4A4437;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px 64px}
  header{text-align:center;margin-bottom:32px}
  .eyebrow{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:.28em;
    color:var(--moss);margin:0 0 6px;text-transform:uppercase}
  h1{font-family:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Helvetica Neue',sans-serif;font-size:38px;font-weight:700;margin:0}
  .sub{color:var(--muted);font-size:14px;margin:8px 0 0}
  .build{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--dim);
    letter-spacing:.14em;margin:6px 0 0}
  .seg{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:10px;
    border:1px solid var(--line);margin:0 auto;width:max-content}
  .seg button{padding:8px 20px;border-radius:7px;border:none;cursor:pointer;
    font-family:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Helvetica Neue',sans-serif;font-size:14px;letter-spacing:.04em;
    background:transparent;color:var(--muted);transition:all .12s ease}
  .seg button[aria-pressed="true"]{background:var(--ember);color:#1A0D06}
  .label{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.14em;margin:0 0 10px}
  .zones{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
  .zone{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;
    border:none;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;
    font-family:inherit;padding:0}
  .disc{width:60px;height:60px;border-radius:50%;border:3px solid var(--line);
    background:var(--surface);transition:all .12s ease}
  .zone[aria-pressed="true"]{color:var(--chalk)}
  .zone[aria-pressed="true"] .disc{border-color:var(--ember);
    background:radial-gradient(circle at 35% 30%,var(--emberDim),var(--surface) 70%);
    box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--emberDim)}
  .zone[disabled]{opacity:.35;cursor:default}
  .stepper{display:flex;align-items:center;gap:12px;background:var(--surface);
    padding:4px 10px;border-radius:10px;border:1px solid var(--line);margin:0 auto;width:max-content}
  .stepper button{width:26px;height:26px;border-radius:6px;border:none;background:var(--raised);
    color:var(--chalk);font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
  .stepper span{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;min-width:56px;text-align:center}
  .opt{display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
    font-size:14px;color:var(--muted);margin:22px 0 0}
  .opt input{width:16px;height:16px;accent-color:var(--ember)}
  .opt.off{color:var(--dim);cursor:default}
  .hint{text-align:center;font-size:11px;color:var(--dim);margin:8px 0 0;min-height:14px}
  .go{width:100%;padding:14px 0;background:var(--ember);color:#1A0D06;border:none;
    border-radius:10px;font-family:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Helvetica Neue',sans-serif;font-size:16px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:10px;margin:18px 0 28px}
  .ticket{background:var(--raised);border:1px solid var(--line);border-radius:12px;
    padding:22px 22px 18px;margin-bottom:20px;animation:fade .26s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .tHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .tId{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted);letter-spacing:.1em}
  .tZone{font-family:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Helvetica Neue',sans-serif;font-size:13px;color:var(--moss);
    letter-spacing:.06em;text-transform:uppercase}
  .tTitle{font-family:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Helvetica Neue',sans-serif;font-size:18px;font-weight:600;margin:0 0 4px}
  .tMeta{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--dim);
    letter-spacing:.08em;margin:0 0 14px;text-transform:uppercase}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:9px;
    align-items:baseline}
  .pre{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted);margin-right:8px}
  .flag{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;margin-left:7px;padding:1px 4px;
    border-radius:3px;border:1px solid var(--line);color:var(--muted);letter-spacing:.05em}
  .reps{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;white-space:nowrap;color:var(--ember)}
  .cardio .reps{color:var(--moss)}
  .cardio .flag{color:var(--moss);border-color:var(--moss)}
  .note{color:var(--muted);font-size:12px;margin:14px 0 0;font-style:italic;line-height:1.5}
  .warn{color:var(--ember);font-size:12px;margin:8px 0 0;line-height:1.5}
  .acts{display:flex;gap:10px;margin-top:20px}
  .ghost{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0;
    background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--chalk);
    font-size:13px;cursor:pointer;font-family:inherit}
  .savedToggle{width:100%;background:none;border:none;color:var(--muted);display:flex;
    align-items:center;justify-content:center;gap:6px;font-size:13px;cursor:pointer;
    padding:8px 0;font-family:inherit}
  .savedItem{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .savedItem button{background:none;border:none;cursor:pointer;font-family:inherit}
  .savedItem .load{color:var(--chalk);text-align:left;font-size:13px;flex:1;padding:0}
  .savedItem .load strong{font-family:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Helvetica Neue',sans-serif;font-weight:500}
  .savedItem .del{color:var(--muted);padding:4px;font-size:15px}
  .empty{text-align:center;color:var(--muted);font-size:13px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <p class="eyebrow">cobaltinou-workoutgen-v2.1</p>
    <h1>WORKOUT GEN</h1>
    <p class="sub">Une séance forgée en un clic, pour les jours sans inspiration.</p>
    <p class="build">21.08.2026</p>
  </header>

  <p class="label">Zone</p>
  <div class="zones" id="zones"></div>

  <p class="label">Durée de la séance</p>
  <div class="stepper">
    <button id="dMinus" aria-label="Diminuer la durée">−</button>
    <span id="dVal">20 min</span>
    <button id="dPlus" aria-label="Augmenter la durée">+</button>
  </div>

  <p class="label" style="margin-top:24px">Difficulté</p>
  <div class="seg" id="diffs">
    <button data-diff="base"   aria-pressed="true">Base</button>
    <button data-diff="inter"  aria-pressed="false">Inter</button>
    <button data-diff="expert" aria-pressed="false">Expert</button>
  </div>

  <label class="opt" id="cardioLabel">
    <input type="checkbox" id="optCardio"> <span id="cardioText">Intégrer un élément cardio</span>
  </label>
  <p class="hint" id="hint"></p>

  <button class="go" id="go">⚒ Forger la séance</button>

  <div id="ticket"></div>

  <button class="savedToggle" id="savedToggle">Séances enregistrées (0) ▾</button>
  <div id="savedList" hidden></div>
</div>

<script>
"use strict";

/* ============================================================
   BANQUE DE MOUVEMENTS
   t : type          B = Ballistic · G = Grind · N = N/A
   c : classes       première = principale
                     UB / LB / PC / ABS / CORE / CARDIO
   kb   : mouvement kettlebell (seul éligible au format Complex)
   uni  : unilatéral (reps par côté)
   hold : isométrique (durée en secondes)
   tech : mouvement technique lent (reps toujours basses)
   carry: porté (distance)
   run  : course (réservée AMRAP / Rounds for Time)
   ============================================================ */
const MOVES = [
  // ---- Kettlebell : ballistics
  {n:"One arm KB swing",           t:"B", c:["PC","CORE"], kb:1, uni:1},
  {n:"KB swing two hand",          t:"B", c:["PC"],        kb:1},
  {n:"KB lateral swing",           t:"B", c:["PC","CORE"], kb:1},
  {n:"One arm KB clean",           t:"B", c:["PC","UB"],   kb:1, uni:1},
  {n:"Double KB clean",            t:"B", c:["PC","UB"],   kb:1},
  {n:"One arm KB snatch",          t:"B", c:["PC","UB"],   kb:1, uni:1},
  {n:"Double KB snatch",           t:"B", c:["PC","UB"],   kb:1},
  {n:"KB sumo squat high pull",    t:"B", c:["PC","UB"],   kb:1},
  {n:"KB ballistic row",           t:"B", c:["UB","PC"],   kb:1},
  {n:"One arm KB clean & jerk",    t:"B", c:["UB","PC"],   kb:1, uni:1},
  {n:"Double KB clean & jerk",     t:"B", c:["UB","PC"],   kb:1},
  {n:"KB side lunge and clean",    t:"B", c:["LB","PC"],   kb:1, uni:1},
  {n:"Burpees over KB",            t:"B", c:["CARDIO","UB"], kb:1, cardio:1, lvl:[5,10,15]},
  // ---- Kettlebell : grinds
  {n:"KB deadlift",                t:"G", c:["PC"],        kb:1},
  {n:"KB romanian deadlift",       t:"G", c:["PC"],        kb:1},
  {n:"KB single leg deadlift",     t:"G", c:["PC","CORE"], kb:1, uni:1},
  {n:"KB goblet squat",            t:"G", c:["LB"],        kb:1},
  {n:"One arm KB overhead squat",  t:"G", c:["LB","CORE"], kb:1, uni:1},
  {n:"Double KB overhead squat",   t:"G", c:["LB","CORE"], kb:1},
  {n:"KB thruster",                t:"G", c:["LB","UB"],   kb:1, uni:1},
  {n:"One arm KB row",             t:"G", c:["UB","CORE"], kb:1, uni:1},
  {n:"Double KB row",              t:"G", c:["UB"],        kb:1},
  {n:"KB alternative renegade row",t:"G", c:["UB","CORE"], kb:1},
  {n:"One arm KB strict press",    t:"G", c:["UB","CORE"], kb:1, uni:1},
  {n:"Double KB strict press",     t:"G", c:["UB"],        kb:1},
  {n:"KB curl biceps",             t:"G", c:["UB"],        kb:1},
  {n:"KB skull crusher",           t:"G", c:["UB"],        kb:1},
  {n:"KB push-up",                 t:"G", c:["UB","CORE"], kb:1},
  {n:"KB turkish get-up",          t:"G", c:["CORE","UB","LB"], kb:1, uni:1, tech:1},
  {n:"KB windmill",                t:"G", c:["CORE","PC"], kb:1, uni:1, tech:1},
  {n:"KB halo",                    t:"G", c:["CORE","UB"], kb:1},
  {n:"KB suitcase carry",          t:"G", c:["CORE"],      kb:1, uni:1, carry:1},
  {n:"KB russian twist",           t:"G", c:["ABS","CORE"],kb:1},
  // ---- Élastique
  {n:"Pallof press with resistance band",   t:"G", c:["CORE"],       uni:1},
  {n:"Oblique rotation with resistance band",t:"G", c:["CORE","ABS"],uni:1},
  {n:"Deadbug with resistance band",        t:"G", c:["CORE","ABS"], uni:1},
  // ---- TRX
  {n:"TRX fallout",                t:"G", c:["CORE"]},
  {n:"TRX ab rollout",             t:"G", c:["CORE","ABS"]},
  {n:"TRX suspended plank",        t:"G", c:["CORE"],      hold:1},
  {n:"TRX side plank",             t:"G", c:["CORE"],      hold:1, uni:1},
  {n:"TRX body saw",               t:"G", c:["CORE"]},
  {n:"TRX kneeling oblique rollout",t:"G",c:["CORE"],      uni:1},
  {n:"TRX resisted rotation",      t:"G", c:["CORE"],      uni:1},
  {n:"TRX hip drop",               t:"G", c:["CORE"],      uni:1},
  {n:"TRX reverse plank",          t:"G", c:["CORE","PC"], hold:1},
  {n:"TRX pike",                   t:"G", c:["ABS","CORE"]},
  {n:"TRX leg raise",              t:"G", c:["ABS","CORE"]},
  // ---- Corde à sauter / sans matériel
  {n:"Double-unders",              t:"B", c:["CARDIO"],        cardio:1, lvl:[30,40,50]},
  {n:"Burpees",                    t:"B", c:["CARDIO"],        cardio:1, lvl:[5,10,15]},
  {n:"Mountain climbers",          t:"B", c:["CARDIO","CORE"], cardio:1, lvl:[20,30,40]},
  {n:"400m run",                   t:"N", c:["CARDIO"],        cardio:1, run:1, fixed:"400 m"},
  {n:"800m run",                   t:"N", c:["CARDIO"],        cardio:1, run:1, fixed:"800 m"},
  {n:"Squat jump",                 t:"B", c:["LB","CARDIO"]},
  {n:"Jumping lunges",             t:"B", c:["LB","CARDIO"],   uni:1},
  {n:"Push-up",                    t:"G", c:["UB","CORE"]},
  {n:"Plank",                      t:"G", c:["CORE"],          hold:1},
  {n:"Hollow body hold",           t:"G", c:["CORE"],          hold:1},
  {n:"Arch hold",                  t:"G", c:["CORE","PC"],     hold:1},
  {n:"Hollow rock",                t:"G", c:["ABS","CORE"]},
  {n:"Sit-up",                     t:"G", c:["ABS"]},
  {n:"V-up",                       t:"G", c:["ABS","CORE"]}
];

/* ------------------------------------------------------------
   FAMILLES DE MOUVEMENTS
   Deux mouvements de la même famille ne peuvent jamais coexister
   dans une séance (ex. Push-up et KB push-up, ou les trois rows).
   Un mouvement composite appartient à plusieurs familles :
   le thruster est un squat ET un press, il exclut donc les deux.
   Tout mouvement absent de cette table forme sa propre famille.
   ------------------------------------------------------------ */
const FAM = {
  "One arm KB swing":["swing"], "KB swing two hand":["swing"], "KB lateral swing":["swing"],
  "One arm KB clean":["clean"], "Double KB clean":["clean"],
  "One arm KB clean & jerk":["cleanjerk","press"], "Double KB clean & jerk":["cleanjerk","press"],
  "One arm KB snatch":["snatch"], "Double KB snatch":["snatch"],
  "KB side lunge and clean":["lunge","clean"], "Jumping lunges":["lunge"],
  "One arm KB row":["row"], "Double KB row":["row"], "KB ballistic row":["row"],
  "One arm KB strict press":["press"], "Double KB strict press":["press"],
  "KB thruster":["thruster","press"],
  "KB deadlift":["deadlift"], "KB romanian deadlift":["deadlift"],
  "One arm KB overhead squat":["ohsquat"], "Double KB overhead squat":["ohsquat"],
  "KB push-up":["pushup"], "Push-up":["pushup"],
  "Burpees":["burpee"], "Burpees over KB":["burpee"],
  "400m run":["run"], "800m run":["run"],
  "Sit-up":["spinalflexion"], "V-up":["spinalflexion"],
  "Hollow body hold":["hollow"], "Hollow rock":["hollow"],
  "Plank":["plank"], "TRX suspended plank":["plank"],
  "TRX side plank":["sideplank"], "TRX hip drop":["sideplank"],
  "TRX fallout":["rollout"], "TRX ab rollout":["rollout"],
  "KB russian twist":["rotation"], "Oblique rotation with resistance band":["rotation"],
  "Pallof press with resistance band":["antirotation"], "TRX resisted rotation":["antirotation"]
};
MOVES.forEach(m => { m.f = FAM[m.n] || [m.n]; });

const ZONES = [
  {id:"UB",   label:"Upper body"},
  {id:"LB",   label:"Lower body"},
  {id:"FULL", label:"Fullbody"},
  {id:"CORE", label:"Core"}
];

const FORMAT_NAMES = {emom:"EMOM", amrap:"AMRAP", rft:"Rounds for Time",
                      complex:"Complex", intervals:"Intervals"};

/* ------------------------------------------------------------
   POOLS PAR ZONE
   Upper / Lower : la classe de zone doit figurer dans c[], mais la
   classe PRINCIPALE ne peut pas être ABS/CORE/CARDIO — sinon un
   gainage se retrouverait dans une séance de jambes.
   Lower body est alimenté par LB *et* PC (validé).
   Fullbody : tous les ballistics, cardio compris.
   Core : grinds dont la classe principale est ABS ou CORE.
   ------------------------------------------------------------ */
function zonePool(zone){
  if(zone==="FULL") return MOVES.filter(m=>m.t==="B");
  if(zone==="CORE") return MOVES.filter(m=>m.t==="G" && (m.c[0]==="ABS"||m.c[0]==="CORE"));
  const wanted = zone==="LB" ? ["LB","PC"] : ["UB"];
  return MOVES.filter(m=>
    m.c.some(c=>wanted.includes(c)) &&
    !["ABS","CORE","CARDIO"].includes(m.c[0])
  );
}

/* ---------------- Helpers ---------------- */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(a){return a[(Math.random()*a.length)|0];}
function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v));}

// Anti-répétition : on pénalise ce qui vient de sortir, sans jamais bloquer.
let lastNames = [], lastFormat = null, lastGlobal = null;

// Registre des familles retenues pour la séance en cours. Toute sélection y
// passe, de sorte qu'aucun ajout ultérieur (ballistic, cardio, complément)
// ne puisse réintroduire un doublon fonctionnel.
function pickFresh(pool, n, fams){
  const fresh = pool.filter(m=>!lastNames.includes(m.n));
  const stale = pool.filter(m=>lastNames.includes(m.n));
  const ordered = [...shuffle(fresh), ...shuffle(stale)];
  const out = [];
  for(const m of ordered){
    if(fams && m.f.some(f=>fams.has(f))) continue;
    out.push(m);
    if(fams) m.f.forEach(f=>fams.add(f));
    if(out.length===n) break;
  }
  return out;
}
function pickAvoiding(list,avoid){
  const fresh = list.filter(x=>x!==avoid);
  return rnd(fresh.length?fresh:list);
}

/* ---------------- Barème de reps ----------------
   diff = "base" | "inter" | "expert"
   Les mouvements cardio ont des valeurs fixes par difficulté, indépendantes
   du barème global. Les courses gardent leur distance : elle fait partie du
   nom du mouvement. Les Intervals travaillent au temps, sans reps.          */
const DIFF_MULT = {base:1, inter:1.5, expert:2};
const DIFF_IDX  = {base:0, inter:1, expert:2};

function repsFor(m, g, format, diff){
  const d = DIFF_MULT[diff] || 1;
  if(format==="intervals") return "30s / 30s";
  if(m.fixed) return m.fixed;
  if(m.lvl)   return m.lvl[DIFF_IDX[diff] || 0] + " reps";
  const scale = v => Math.max(1, Math.round(v*d));
  const scale5 = v => Math.max(10, Math.round(v*d/5)*5);
  if(m.carry)  return scale5(g==="cf" ? 40 : 30) + " m";
  if(m.hold)   {
    const s = g==="cf" ? 45 : 30;
    return m.uni ? scale5(Math.round(s*0.66)) + " s / côté" : scale5(s) + " s";
  }
  if(m.tech){
    const r = g==="cf" ? 3 : g==="sf" ? 1 : 2;
    return scale(r) + " / côté";
  }
  if(typeof g === "number"){
    // Equal : le même chiffre partout, par côté pour les unilatéraux
    return scale(g) + (m.uni ? " / côté" : " reps");
  }
  let r = g==="cf" ? (m.t==="B" ? 20 : 10)
                   : (m.t==="B" ? 10 : 5);
  if(m.uni) r = Math.max(3, Math.round(r/2));
  return scale(r) + (m.uni ? " / côté" : " reps");
}

/* ---------------- Construction de la séance ---------------- */
function buildSession(zone, duration, cardioOn, diff){
  // --- format
  let formats = ["emom","amrap","rft","complex","intervals"];
  if(zone==="CORE") formats = formats.filter(f=>f!=="complex");
  const format = pickAvoiding(formats, lastFormat);

  // --- type global caché
  let globals;
  if(format==="intervals")     globals = ["none"];
  else if(format==="complex")  globals = ["sf","equal"];
  else if(zone==="CORE")       globals = ["cf","equal"];
  else                         globals = ["cf","sf","equal"];
  let global = pickAvoiding(globals, lastGlobal);
  const equalBase = rnd([4,5,8,10]);
  const g = global==="equal" ? equalBase : global;   // Equal passe la base en nombre

  // --- nombre de mouvements
  let count;
  if(format==="complex")      count = duration<=20 ? 5 : 6;
  else if(duration<=12)       count = 3;
  else if(duration<=20)       count = 4;
  else                        count = 5;

  // --- pool
  // Complex et Intervals n'accueillent jamais de cardio : l'un s'exécute sans
  // reposer la kettlebell, l'autre travaille au temps sur chaque station.
  // La zone Core en est également exclue : elle reste 100 % abdos/gainage.
  const noCardioFormat = format==="complex" || format==="intervals";
  const optionCardio = cardioOn && duration>=14 && !noCardioFormat && zone!=="CORE";

  let pool = zonePool(zone);
  if(format==="complex") pool = pool.filter(m=>m.kb && !m.carry && !m.hold && !m.cardio);
  // Le cardio n'apparaît spontanément qu'en Fullbody, et jamais si l'option
  // en ajoute déjà un : maximum 1 cardio par programme, toutes sources confondues.
  if(zone!=="FULL" || optionCardio || noCardioFormat) pool = pool.filter(m=>!m.cardio);

  const fams = new Set();
  let picked;
  if(zone==="UB" || zone==="LB"){
    // tendance Grind + exactement 1 Ballistic
    const grinds = pool.filter(m=>m.t==="G");
    const balls  = pool.filter(m=>m.t==="B");
    picked = [...pickFresh(grinds, Math.max(1,count-1), fams)];
    if(balls.length) picked.push(pickFresh(balls, 1, fams)[0]);
    picked = picked.filter(Boolean).slice(0,count);
  } else {
    picked = pickFresh(pool, count, fams);
  }

  // Pas plus de 2 gainages tenus : un circuit 100 % isométrique n'a pas d'intérêt.
  const holds = picked.filter(m=>m.hold);
  if(holds.length>2){
    const keep = new Set(holds.slice(0,2).map(m=>m.n));
    picked = picked.filter(m=>!m.hold || keep.has(m.n));
    const spare = pool.filter(m=>!m.hold && !picked.some(p=>p.n===m.n));
    picked = picked.concat(pickFresh(spare, count-picked.length, fams));
  }

  // --- Fullbody sans option : au plus 1 cardio tiré spontanément
  if(zone==="FULL" && !optionCardio){
    let seen=false;
    picked = picked.filter(m=>{
      if(!m.cardio) return true;
      if(seen) return false;
      seen=true; return true;
    });
    if(picked.length<count){
      const extra = pickFresh(pool.filter(m=>!m.cardio && !picked.some(p=>p.n===m.n)),
                              count-picked.length, fams);
      picked = picked.concat(extra);
    }
  }

  // --- option cardio : ajoute un créneau (>= 14 min seulement)
  if(optionCardio){
    let bank = MOVES.filter(m=>m.cardio);
    if(!["amrap","rft"].includes(format)) bank = bank.filter(m=>!m.run);
    const chosen = pickFresh(bank, 1, fams)[0];
    if(chosen) picked.splice((Math.random()*(picked.length+1))|0, 0, chosen);
  }

  lastNames  = picked.map(m=>m.n);
  lastFormat = format;
  lastGlobal = global;

  return finalize({zone, format, global, g, diff, duration, moves:picked});
}

/* ------------------------------------------------------------
   FINALIZE — calcule rounds, durée réelle, libellés et reps à
   partir d'une liste de mouvements. Utilisé aussi bien par la
   génération que par l'ajustement, pour qu'un ajustement produise
   exactement ce qu'aurait produit une génération équivalente.
   ------------------------------------------------------------ */
function finalize(s){
  const {zone, format, global, g, diff, duration, moves} = s;

  // EMOM et Intervals se déroulent en cycles complets : la durée réelle est
  // ajustée au multiple entier du cycle le plus proche de la durée demandée,
  // sinon le dernier cycle serait tronqué (ex. 14 min / 5 stations = 5+5+4).
  let rounds = null, realDuration = duration;
  if(format==="rft" || format==="complex"){
    rounds = clamp(Math.round(duration/4), 3, 8);
  } else if(format==="emom" || format==="intervals"){
    const cycle = moves.length;                     // 1 min par mouvement
    rounds = Math.max(2, Math.round(duration/cycle));
    while(cycle*rounds > 30 && rounds > 2) rounds--;
    realDuration = cycle * rounds;
  }

  let label, note;
  if(format==="emom"){
    label = "EMOM " + realDuration;
    note  = "Une station par minute — " + rounds + " cycles complets de " + moves.length +
            " min." + (realDuration!==duration ? " Durée ajustée depuis " + duration +
            " min pour tomber sur un nombre entier de cycles." : "") +
            " Le temps restant dans la minute est ton repos.";
  } else if(format==="amrap"){
    label = "AMRAP " + duration + " min";
    note  = "Le plus de tours possible dans le temps imparti. Note ton score pour la prochaine fois.";
  } else if(format==="rft"){
    label = rounds + " Rounds for Time";
    note  = rounds + " tours du circuit, le plus vite possible en gardant une technique propre. " +
            "Objectif : boucler sous " + duration + " min.";
  } else if(format==="complex"){
    label = "Complex · " + rounds + " rounds";
    note  = "Sans reposer la kettlebell : enchaîne tous les mouvements d'un côté, " +
            "puis immédiatement de l'autre — cela fait 1 round. Repos 90-120s entre les rounds.";
  } else {
    label = "Intervals · " + rounds + " rounds";
    note  = "30s de travail, 30s de repos sur chaque mouvement. Un passage complet du circuit " +
            "= 1 round, soit " + realDuration + " min au total." +
            (realDuration!==duration ? " (ajusté depuis " + duration + " min.)" : "");
  }

  return {
    zone, format, global, g, diff, duration, realDuration, rounds, label, note,
    names: moves.map(m=>m.n),
    movements: moves.map((m,i)=>({
      n:m.n, t:m.t, cardio:!!m.cardio,
      prefix: format==="emom" ? "Min "+(i+1) : null,
      reps: repsFor(m, g, format, diff)
    }))
  };
}

/* ------------------------------------------------------------
   ADJUST — retouche une séance existante sans la retirer au sort.
   Les mouvements restent les mêmes ; seuls la difficulté et la
   présence d'un élément cardio changent.
   ------------------------------------------------------------ */
const BY_NAME = {};
MOVES.forEach(m => BY_NAME[m.n] = m);

function baseCount(duration, format){
  if(format==="complex") return duration<=20 ? 5 : 6;
  return duration<=12 ? 3 : duration<=20 ? 4 : 5;
}

function adjustSession(s, newDiff, cardioOn){
  let moves = s.names.map(n=>BY_NAME[n]).filter(Boolean);
  const hasCardio = moves.some(m=>m.cardio);
  const warns = [];

  if(cardioOn && !hasCardio){
    if(s.duration < 14)  warns.push("cardio impossible sous 14 min");
    else if(s.zone==="CORE")        warns.push("pas de cardio sur une séance Core");
    else if(s.format==="complex")   warns.push("pas de cardio sur un Complex");
    else if(s.format==="intervals") warns.push("pas de cardio sur un Intervals");
    else {
      const fams = new Set();
      moves.forEach(m=>m.f.forEach(f=>fams.add(f)));
      let bank = MOVES.filter(m=>m.cardio);
      if(!["amrap","rft"].includes(s.format)) bank = bank.filter(m=>!m.run);
      bank = bank.filter(m=>!m.f.some(f=>fams.has(f)));
      const chosen = bank.length ? bank[(Math.random()*bank.length)|0] : null;
      if(chosen) moves.splice((Math.random()*(moves.length+1))|0, 0, chosen);
      else warns.push("aucun cardio compatible avec cette séance");
    }
  } else if(!cardioOn && hasCardio){
    moves = moves.filter(m=>!m.cardio);
    // Si le retrait passe sous le format attendu, on complète avec un
    // mouvement de la zone plutôt que de raccourcir la séance.
    const target = baseCount(s.duration, s.format);
    if(moves.length < target){
      const fams = new Set();
      moves.forEach(m=>m.f.forEach(f=>fams.add(f)));
      let pool = zonePool(s.zone).filter(m=>!m.cardio && !m.f.some(f=>fams.has(f)));
      if(s.format==="complex") pool = pool.filter(m=>m.kb && !m.carry && !m.hold);
      if(s.zone==="UB" || s.zone==="LB") pool = pool.filter(m=>m.t==="G");
      moves = moves.concat(pickFresh(pool, target-moves.length, fams));
    }
  }

  const out = finalize({zone:s.zone, format:s.format, global:s.global, g:s.g,
                        diff:newDiff, duration:s.duration, moves});
  out.warn = warns.length ? warns.join(" · ") : null;
  return out;
}

/* ---------------- État & stockage ---------------- */
const KEY="workoutgen-favorites";
let zone="FULL", duration=20, diff="base", session=null, savedOpen=false, saved=[];

// Le stockage local est indisponible dans certains contextes (aperçu Fichiers,
// navigation privée). On le teste une fois pour pouvoir le dire à l'utilisateur
// plutôt que d'échouer en silence.
let storageOK = false;
try{
  localStorage.setItem("__t","1"); localStorage.removeItem("__t");
  storageOK = true;
  saved = JSON.parse(localStorage.getItem(KEY)||"[]");
}catch(e){ storageOK = false; saved = []; }

function persist(){
  if(!storageOK) return false;
  try{ localStorage.setItem(KEY, JSON.stringify(saved)); return true; }
  catch(e){ return false; }
}

const $=id=>document.getElementById(id);
const zoneLabel=id=>(ZONES.find(z=>z.id===id)||{}).label||id;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("zones").innerHTML = ZONES.map(z=>
  `<button class="zone" data-zone="${z.id}" aria-pressed="${z.id===zone}">
     <span class="disc"></span><span>${z.label}</span></button>`).join("");

$("zones").addEventListener("click", e=>{
  const b=e.target.closest(".zone");
  if(!b || b.disabled) return;
  zone=b.dataset.zone;
  syncUI();
});

function setDuration(v){
  duration = clamp(v, 8, 30);
  $("dVal").textContent = duration + " min";
  // Fullbody est bloqué sous 14 min : bascule automatique
  if(duration<14 && zone==="FULL") zone="UB";
  syncUI();
}
$("dMinus").onclick = ()=>setDuration(duration-2);
$("dPlus").onclick  = ()=>setDuration(duration+2);

function syncUI(){
  const shortSession = duration < 14;
  const coreZone = zone === "CORE";
  const noCardio = shortSession || coreZone;
  document.querySelectorAll(".zone").forEach(b=>{
    const isFull = b.dataset.zone==="FULL";
    b.disabled = isFull && shortSession;
    b.setAttribute("aria-pressed", b.dataset.zone===zone);
  });
  $("optCardio").disabled = noCardio;
  if(noCardio) $("optCardio").checked = false;
  $("cardioLabel").classList.toggle("off", noCardio);
  $("hint").textContent =
    coreZone   ? "Zone Core : 100 % abdos et gainage, pas d'élément cardio."
  : shortSession ? "Sous 14 min : Fullbody et option cardio indisponibles (séance trop courte)."
  : "";
}

$("diffs").addEventListener("click", e=>{
  const b=e.target.closest("button");
  if(!b) return;
  diff=b.dataset.diff;
  $("diffs").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.diff===diff));
});

function generate(){
  session = Object.assign(
    {id:Date.now(), zone,
     createdAt:new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"})},
    buildSession(zone, duration, $("optCardio").checked, diff)
  );
  renderTicket();
}
$("go").onclick = generate;

function renderTicket(saveLabel){
  if(!session){ $("ticket").innerHTML=""; return; }
  const rows = session.movements.map(m=>{
    const pre = m.prefix ? `<span class="pre">${esc(m.prefix)}</span>` : "";
    const flag = m.cardio ? "CARDIO" : (m.t==="B" ? "BAL" : m.t==="G" ? "GRIND" : "—");
    return `<div class="row${m.cardio?" cardio":""}">
      <span>${pre}${esc(m.n)}<span class="flag">${flag}</span></span>
      <span class="reps">${esc(m.reps)}</span></div>`;
  }).join("");
  const gName = {cf:"CrossFit", sf:"StrongFirst", equal:"Equal", none:"Au temps"}[session.global];
  const dName = {base:"Base", inter:"Inter", expert:"Expert"}[session.diff] || "Base";
  $("ticket").innerHTML = `<div class="ticket">
    <div class="tHead">
      <span class="tId">N° ${String(session.id).slice(-5)} · ${session.createdAt}</span>
      <span class="tZone">${esc(zoneLabel(session.zone))}</span>
    </div>
    <p class="tTitle">${esc(session.label)}</p>
    <p class="tMeta">${session.movements.length} mouvements · ${esc(dName)} · barème ${esc(gName)}</p>
    ${rows}
    <p class="note">${esc(session.note)}</p>
    ${session.warn ? `<p class="warn">Ajustement partiel : ${esc(session.warn)}.</p>` : ""}
    <div class="acts">
      <button class="ghost" id="regen">⇄ Ajuster</button>
      <button class="ghost" id="save">🔖 ${saveLabel||"Enregistrer"}</button>
    </div></div>`;
  $("regen").onclick = ()=>{
    const id = session.id, createdAt = session.createdAt;
    session = Object.assign({id, createdAt},
                            adjustSession(session, diff, $("optCardio").checked));
    renderTicket();
  };
  $("save").onclick = ()=>{
    saved = [session, ...saved.filter(s=>s.id!==session.id)].slice(0,20);
    const ok = persist();
    renderSaved();
    renderTicket(ok ? "Enregistrée" : "Stockage indisponible");
  };
}

function renderSaved(){
  $("savedToggle").textContent = `Séances enregistrées (${saved.length}) ${savedOpen?"▴":"▾"}`;
  $("savedList").hidden = !savedOpen;
  if(!storageOK){
    $("savedList").innerHTML = '<p class="empty">Stockage local indisponible dans ce contexte — ' +
      'les séances ne seront pas conservées après fermeture. Installe la page sur l\'écran ' +
      'd\'accueil depuis Safari pour activer l\'enregistrement.</p>';
    return;
  }
  if(!saved.length){
    $("savedList").innerHTML = '<p class="empty">Aucune séance enregistrée pour l\'instant.</p>';
    return;
  }
  $("savedList").innerHTML = saved.map(s=>
    `<div class="savedItem">
      <button class="load" data-id="${s.id}">
        <strong>${esc(zoneLabel(s.zone))} · ${esc(FORMAT_NAMES[s.format]||s.format)}</strong>
        <span style="color:var(--muted)"> — ${s.duration}min · ${s.createdAt}</span>
      </button>
      <button class="del" data-del="${s.id}" aria-label="Supprimer">🗑</button>
    </div>`).join("");
}
$("savedToggle").onclick = ()=>{ savedOpen=!savedOpen; renderSaved(); };
$("savedList").addEventListener("click", e=>{
  const del = e.target.closest("[data-del]");
  if(del){ saved = saved.filter(s=>String(s.id)!==del.dataset.del); persist(); renderSaved(); return; }
  const load = e.target.closest(".load");
  if(load){
    const s = saved.find(x=>String(x.id)===load.dataset.id);
    if(!s) return;
    session=s; zone=s.zone; setDuration(s.duration);
    diff = s.diff || "base";
    $("diffs").querySelectorAll("button").forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.diff===diff));
    $("optCardio").checked = s.movements.some(m=>m.cardio);
    savedOpen=false; renderSaved(); renderTicket("Enregistrée");
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

setDuration(20);
renderSaved();
generate();
</script>

<script>
// Service worker : met l'app en cache pour un fonctionnement hors ligne complet.
// Chemin relatif, pour rester valable sous /workoutgen/ comme à la racine.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(e=>console.log("SW non enregistré:", e));
  });
}
</script>
